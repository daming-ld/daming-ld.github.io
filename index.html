<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Daming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var bg = localStorage.getItem('site-bg');
                if (bg) document.documentElement.setAttribute('data-bg', bg);
            } catch (e) { }
        })();
    </script>
    <link rel="preload" href="assets/css/style.css" as="style">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preload" as="image" href="assets/photo/1.png">
    <link rel="preload" as="image" href="assets/photo/2.jpg">
    <link rel="preload" as="image" href="assets/photo/3.jpg">
    
</head>

<body class="star-canvas-page">
    <div data-site-nav></div>

    <main class="home-quote-shell">
        <section class="glass-card home-quote-card" aria-label="首页引言">
            <p class="home-quote-line" id="homeQuoteText" data-text="真理就是螺旋升天"></p>
            <p class="home-quote-author" id="homeQuoteAuthor" data-text="——Daming" data-photo-url="photo.html" role="link" tabindex="0" aria-label="查看 Daming 影像档案"></p>
            <div class="home-photo-wrap">
                <img class="home-photo" src="assets/photo/1.png" alt="Daming 影像" width="850" height="883">
            </div>
            <div class="home-icon-list" aria-label="快捷入口">
                <button class="home-icon-item home-quote-refresh" id="homeQuoteRefresh" type="button" aria-label="换一句格言" title="换一句格言">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <polyline points="21 3 21 9 15 9"></polyline>
                    </svg>
                </button>
                <a class="home-icon-item" href="https://gitee.com/daming_ld" target="_blank" rel="noopener" aria-label="Gitee" title="Gitee">
                    <img src="assets/icon/gitee.svg" alt="Gitee" width="128" height="128">
                </a>
                <a class="home-icon-item" href="https://github.com/daming-ld" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
                    <img src="assets/icon/github.svg" alt="GitHub" width="128" height="128">
                </a>
                <button class="home-icon-item" type="button" disabled aria-label="Steam（敬请期待）" title="Steam（敬请期待）">
                    <img src="assets/icon/steam.svg" alt="Steam" width="128" height="128">
                </button>
                <button class="home-icon-item home-icon-item--secret" id="secretEasterEntry" type="button" aria-label="神秘入口">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3l3.1 6.3L22 10.3l-5 4.9 1.2 6.9L12 18.8l-6.2 3.3L7 15.2 2 10.3l6.9-1z"></path>
                    </svg>
                </button>
            </div>
        </section>
    </main>

    <!-- 原有脚本 -->
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/nav-component.js" defer></script>
    <script src="assets/js/flashlight.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/prefetch.js" defer></script>
    
    <script>
        // ===== 原有打字效果 =====
        (function () {
            function typeText(element, text, speed, done) {
                if (!element) return;
                var index = 0;
                element.textContent = '';
                function step() {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index += 1;
                        window.setTimeout(step, speed);
                        return;
                    }
                    if (typeof done === 'function') done();
                }
                step();
            }

            function initHomeTyping() {
                var quote = document.getElementById('homeQuoteText');
                var author = document.getElementById('homeQuoteAuthor');
                var refresh = document.getElementById('homeQuoteRefresh');
                if (!quote || !author) return;

                var quotes = [
                    '吃得苦中苦，方得苦中苦。',
                    '发生了什么？',
                    '眼不一定高，手不一定低。',
                    '谜语人滚出地球',
                    '真理就是螺旋升天',
                    '吃饱了才有哲学家，但吃太饱了就会变成伪人',
                    '雪豹，闭嘴'
                ];

                var currentIndex = -1;
                var typingToken = 0;

                function pickQuote() {
                    var next = currentIndex;
                    while (next === currentIndex) {
                        next = Math.floor(Math.random() * quotes.length);
                    }
                    currentIndex = next;
                    return quotes[next];
                }

                function showQuote() {
                    var token = ++typingToken;
                    quote.dataset.text = pickQuote();
                    author.dataset.text = author.dataset.text || '——Daming';
                    quote.textContent = '';
                    author.textContent = '';
                    typeText(quote, quote.dataset.text || '', 90, function () {
                        if (token !== typingToken) return;
                        window.setTimeout(function () {
                            if (token !== typingToken) return;
                            typeText(author, author.dataset.text || '', 75);
                        }, 180);
                    });
                }

                showQuote();

                if (refresh) {
                    refresh.addEventListener('click', showQuote);
                }

                var easterBtn = document.getElementById('navEasterBtn');
                if (easterBtn) {
                    var RAPID_MS = 600;
                    var RAPID_NEED = 5;
                    var lastClick = 0;
                    var rapid = 0;
                    var onTwo = false;
                    var easterEnabled = false;

                    function applyEaster(src, on) {
                        var photo = document.querySelector('.home-photo');
                        if (photo) {
                            photo.setAttribute('src', src);
                            if (window.flashlightPhoto) window.flashlightPhoto.reveal(photo);
                        }
                        document.documentElement.classList.toggle('easter-bg', on);
                        document.body.classList.toggle('easter-bg', on);
                        document.documentElement.classList.toggle('easter-enabled', on);
                        document.body.classList.toggle('easter-enabled', on);
                        try {
                            if (on) localStorage.setItem('easter-enabled', '1');
                            else localStorage.removeItem('easter-enabled');
                        } catch (e) { }
                        if (window.flashlightPhoto) {
                            window.flashlightPhoto.setSrc(src);
                            window.flashlightPhoto.setEasterBg(on);
                        }
                    }

                    function enableEaster() {
                        easterEnabled = true;
                        applyEaster('assets/photo/3.jpg', true);
                    }

                    function disableEaster() {
                        easterEnabled = false;
                        onTwo = !onTwo;
                        applyEaster(onTwo ? 'assets/photo/2.jpg' : 'assets/photo/1.png', false);
                    }

                    easterBtn.addEventListener('click', function () {
                        if (easterEnabled) {
                            disableEaster();
                            return;
                        }

                        var now = Date.now();
                        rapid = (now - lastClick <= RAPID_MS) ? rapid + 1 : 1;
                        lastClick = now;

                        if (rapid >= RAPID_NEED) {
                            rapid = 0;
                            enableEaster();
                            return;
                        }

                        onTwo = !onTwo;
                        applyEaster(onTwo ? 'assets/photo/2.jpg' : 'assets/photo/1.png', false);
                    });
                }

                var secretEntry = document.getElementById('secretEasterEntry');
                if (secretEntry) {
                    secretEntry.addEventListener('click', function () {
                        if (easterEnabled && document.body.classList.contains('magnifier-active')) window.location.href = 'photo.html';
                    });
                }

                var photoUrl = author.dataset.photoUrl || '';
                if (photoUrl) {
                    author.addEventListener('click', function () {
                        window.location.href = photoUrl;
                    });
                    author.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            window.location.href = photoUrl;
                        }
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHomeTyping, { once: true });
            } else {
                initHomeTyping();
            }
        })();

    </script>
</body>

</html>
