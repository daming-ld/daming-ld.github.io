<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Daming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var bg = localStorage.getItem('site-bg');
                if (bg) document.documentElement.setAttribute('data-bg', bg);
            } catch (e) { }
        })();
    </script>
    <link rel="preload" href="assets/css/style.css" as="style">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="star-canvas-page">
    <svg class="liquid-glass-defs" aria-hidden="true" width="0" height="0" focusable="false">
        <defs>
            <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%"
                color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="1" seed="7" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="0.8" result="soft-noise" />
                <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="14" xChannelSelector="R"
                    yChannelSelector="G" result="distorted" />
                <feGaussianBlur in="distorted" stdDeviation="0.2" result="smoothed" />
                <feComposite in="smoothed" in2="SourceAlpha" operator="in" />
            </filter>
        </defs>
    </svg>
    <header class="site-header">
        <nav class="nav">
            <button class="top-btn" type="button" aria-label="回到顶部">
                <img class="top-btn__icon" src="assets/icon/top.svg" alt="" aria-hidden="true">
            </button>
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="about.html">关于</a>
                <a href="projects.html">项目</a>
                <a href="posts.html">文章</a>
                <div class="nav-indicator"></div>
            </div>
            <span class="nav-reading-title"></span>
            <div class="bg-selector" hidden>
                <button class="bg-btn" data-bg="paper" aria-label="纸张纹理背景" style="--dot-color: #E2D8CA;"><span class="bg-btn__dot"></span></button>
                <button class="bg-btn" data-bg="gradient" aria-label="渐变光晕背景" style="--dot-color: #C4956A;"><span class="bg-btn__dot"></span></button>
                <button class="bg-btn" data-bg="clean" aria-label="极简纯白背景" style="--dot-color: #E8E4DD;"><span class="bg-btn__dot"></span></button>
            </div>
            <button class="theme-toggle" type="button" aria-label="打开手电�? aria-pressed="false" data-icon-sun="assets/icon/sun.svg" data-icon-moon="assets/icon/moon.svg">
                <img class="theme-toggle__icon" src="assets/icon/moon.svg" alt="" aria-hidden="true">
            </button>
        </nav>
    </header>

    <main class="home-quote-shell">
        <section class="glass-card home-quote-card" aria-label="首页引言">
            <p class="home-quote-line" id="homeQuoteText" data-text="这是一句很有哲理的�?.."></p>
            <p class="home-quote-author" id="homeQuoteAuthor" data-text="——Daming" data-photo-url="photo.html" role="link" tabindex="0" aria-label="查看 Daming 影像档案"></p>
        </section>
    </main>

    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/prefetch.js" defer></script>
    <script>
        (function () {
            function typeText(element, text, speed, done) {
                if (!element) return;
                var index = 0;
                element.textContent = '';
                function step() {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index += 1;
                        window.setTimeout(step, speed);
                        return;
                    }
                    if (typeof done === 'function') done();
                }
                step();
            }

            function initHomeTyping() {
                var quote = document.getElementById('homeQuoteText');
                var author = document.getElementById('homeQuoteAuthor');
                if (!quote || !author) return;

                var quotes = [
                    '这是一句很有哲理的�?..',
                    '人非无过，孰能圣�?,
                    '如果你不相信自己，那就相信我',
                    'efliajdbasdklvgjgaldkja>@.',
                    'The quick brown fox jumps over the lazy dog'
                ];
                quote.dataset.text = quotes[Math.floor(Math.random() * quotes.length)];

                typeText(quote, quote.dataset.text || '', 90, function () {
                    window.setTimeout(function () {
                        typeText(author, author.dataset.text || '', 75);
                    }, 180);
                });

                var photoUrl = author.dataset.photoUrl || '';
                if (photoUrl) {
                    author.addEventListener('click', function () {
                        window.location.href = photoUrl;
                    });
                    author.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            window.location.href = photoUrl;
                        }
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHomeTyping, { once: true });
            } else {
                initHomeTyping();
            }
        })();
    </script>
</body>

</html>
