<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/icon/top.png">
  <script>
    (function () {
      var allowed = false;
      try {
        allowed = localStorage.getItem('easter-enabled') === '1';
      } catch (e) { }
      if (!allowed) {
        location.replace('404.html');
      }
    })();
  </script>
  <meta name="theme-color" content="#090909">
  <title>影像 | Daming</title>
  <link rel="preload" href="assets/css/style.css" as="style">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="photo-page">
  <header class="photo-header">
    <a class="photo-header__brand" href="index.html" aria-label="返回 Daming 首页">
      <span>DAMING</span>
      <span>PHOTO ARCHIVE</span>
    </a>
    <a class="photo-header__menu" href="#photo-grid">浏览作品 <span aria-hidden="true">↓</span></a>
  </header>

  <main>
    <section class="photo-hero" aria-labelledby="photo-title">
      <p class="photo-hero__eyebrow">VISUAL NOTES / 2026</p>
      <h1 id="photo-title">影像</h1>
      <p class="photo-hero__intro">把停留过的画面，编排成一组可以慢慢翻阅的视觉笔记。</p>
      <div class="photo-hero__images" aria-hidden="true">
        <figure class="photo-hero__image photo-hero__image--1">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024" fetchpriority="high">
        </figure>
        <figure class="photo-hero__image photo-hero__image--2">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024" fetchpriority="auto">
        </figure>
        <figure class="photo-hero__image photo-hero__image--3">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024" fetchpriority="auto">
        </figure>
      </div>
      <p class="photo-hero__scroll">SCROLL TO EXPLORE <span aria-hidden="true">↓</span></p>
    </section>

    <section class="photo-statement" aria-label="作品说明">
      <div class="photo-statement__background" data-photo-statement-background aria-hidden="true">
        <figure class="photo-statement__background-image" style="--photo-stack-index: 0">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
        </figure>
        <div class="photo-statement__floating" data-photo-floating-layer="0">
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 0">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 1">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
        </div>
        <figure class="photo-statement__background-image" style="--photo-stack-index: 1">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
        </figure>
        <div class="photo-statement__floating" data-photo-floating-layer="1">
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 0">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 1">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
        </div>
        <figure class="photo-statement__background-image" style="--photo-stack-index: 2">
          <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
        </figure>
        <div class="photo-statement__floating" data-photo-floating-layer="2">
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 0">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
          <figure class="photo-statement__floating-card photo-statement__floating-card--portrait" style="--photo-card-index: 1">
            <img src="assets/photo/2.jpg" alt="" width="1024" height="1024">
          </figure>
        </div>
        <figure class="photo-statement__background-image photo-statement__background-image--type" style="--photo-stack-index: 3">
          <img src="assets/photo/2.jpg" alt="" width="1600" height="1200">
        </figure>
      </div>
    </section>

    <section class="photo-grid-section" id="photo-grid" aria-labelledby="photo-grid-title">
      <div class="photo-grid-section__head">
        <h2 id="photo-grid-title">FREE<br>CANVAS</h2>
      </div>

      <div class="photographyImageGrid__rows gridContainer" data-photo-canvas aria-label="可拖动作品画布">
        <!-- 网格内容由内联脚本从 assets/getphoto/ 动态构建 -->
      </div>
    </section>
  </main>

  <footer class="photo-footer">
    <p>DAMING / PHOTO ARCHIVE</p>
    <a href="index.html">返回首页 <span aria-hidden="true">↗</span></a>
  </footer>

  <dialog class="photo-dialog" data-photo-dialog aria-labelledby="photo-dialog-title">
    <button class="photo-dialog__close" type="button" data-photo-close aria-label="关闭作品查看器">×</button>
    <div class="photo-dialog__content">
      <div class="photo-dialog__image-wrap">
        <img class="photo-dialog__image" data-photo-dialog-image src="" alt="" role="button" tabindex="0" draggable="false">
      </div>
      <div class="photo-dialog__info">
        <p data-photo-dialog-count>01 / 49</p>
        <h2 id="photo-dialog-title" data-photo-dialog-title></h2>
        <p data-photo-dialog-category></p>
        <p data-photo-dialog-description></p>
      </div>
    </div>
    <div class="photo-dialog__controls">
      <button type="button" data-photo-previous aria-label="查看上一件作品">←</button>
      <button type="button" data-photo-next aria-label="查看下一件作品">→</button>
    </div>
  </dialog>

  <script>
    (function () {
      var canvas = document.querySelector('[data-photo-canvas]');
      var placeholderSrc = 'assets/photo/2.jpg';
      var fallbackFiles = ['4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.gif', '10.gif', '11.gif', '12.gif', '13.gif'];
      var knownDimensions = {
        '4.jpg': [850, 501],
        '5.jpg': [761, 1450],
        '6.jpg': [725, 1450],
        '7.jpg': [725, 1450],
        '8.jpg': [725, 1450],
        '9.gif': [400, 400],
        '10.gif': [240, 240],
        '11.gif': [463, 412],
        '12.gif': [260, 238],
        '13.gif': [150, 150],
        '0d5988703fec41e342100c2e08859f30.jpg': [2160, 3840],
        '17b318f6d7ec22fb5e889c558efa674d.jpg': [1400, 2046],
        '2b352abc32061b638acc505b267f8986.jpg': [1280, 1928],
        '36fdd62a64bcd2dbc711747dcf8ea442.jpg': [2160, 3840],
        '3d8be3acc2c36f0c29c470ae85a8d6a6.jpg': [1448, 2048],
        '413b9bd576a23ba0ffe15a55256f7695.jpg': [2160, 3840],
        '4e4fb493f69c8df5f2a66ca4243e09c9.jpg': [850, 1269],
        '516e40cff81d64aa4a456b04a671c18b.jpg': [2160, 3840],
        '60a6f76895c1bd9144afe35e5e8b25c4.jpg': [2160, 3840],
        '6ef8a1a6be4caecca012ecd3d5e63aab.jpg': [2362, 4724],
        '7151497cf280910e0575d63df67a4952.jpg': [862, 1825],
        '74f7eab3406ddd2909c43829daa0bc20.jpg': [2160, 3840],
        'a68f30ecd661bebc02c68f08f2ee454c.jpg': [2160, 3840],
        'b4382be41e58424f6b5b1f2e2c83d3dc.jpg': [941, 1672],
        'c75840fb6b30bf8be7b61768b7ba2121.jpg': [2160, 3840],
        'd3b1dabf74997f2a14dbd930a9f4dea2.jpg': [5788, 8186],
        'd3f2de4f04b4f397a15b78ce804fc379.jpg': [832, 1145],
        'ddab407ba18d5708d4fa5c282a4637f8.jpg': [3394, 5733],
        'e7679990866abaa572a546a5384a400a.jpg': [2160, 3840],
        'fb1f08de8b6881064d135df8f7537c1f.jpg': [1280, 1856]
      };

      var displayOrder = ['4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.gif', '10.gif', '12.gif', '13.gif', '11.gif'];

      function swapWhenReady(image, src) {
        if (!src || src === image.src) return;
        var loader = new Image();
        loader.onload = function () { image.src = src; };
        loader.onerror = function () { image.src = src; };
        loader.src = src;
      }

      function makeCard(name, index, isGif) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'photographyImageGridItem visible ' + (isGif ? 'photographyImageGridItem--gif' : 'photographyImageGridItem--fit');
        button.setAttribute('data-photo-card', '');
        button.setAttribute('data-index', String(index));
        button.setAttribute('data-photo-title', '影像 ' + String(index + 1).padStart(2, '0'));
        button.setAttribute('data-photo-category', isGif ? 'GIF 动图' : '日常记录 2026');
        button.setAttribute('data-photo-description', '收录于 Daming 影像档案。');
        button.setAttribute('data-photo-src', 'assets/getphoto/' + name);
        button.setAttribute('aria-label', 'View image ' + (index + 1));

        var image = document.createElement('img');
        image.className = 'image useFade loaded photographyImageGridItem__image';
        image.src = placeholderSrc;
        image.alt = '';
        image.loading = 'lazy';
        image.draggable = 'false';
        if (knownDimensions[name]) {
          image.width = knownDimensions[name][0];
          image.height = knownDimensions[name][1];
        }
        swapWhenReady(image, 'assets/getphoto/' + name);

        button.appendChild(image);
        return button;
      }

      function toNames(list) {
        if (!list || !list.length) return [];
        return list.map(function (item) {
          return typeof item === 'string' ? item : item.name;
        }).filter(function (name) {
          return /\.(jpg|gif)$/i.test(name);
        }).sort(function (a, b) {
          return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0);
        });
      }

      function orderedNames(names) {
        var known = displayOrder.filter(function (name) {
          return names.indexOf(name) !== -1;
        });
        var extras = names.filter(function (name) {
          return displayOrder.indexOf(name) === -1;
        });
        return known.concat(extras);
      }

      function spanFor(name) {
        var dims = knownDimensions[name];
        return dims ? dims[0] / dims[1] : 1;
      }

      function isTall(name) {
        return spanFor(name) < 1;
      }

      function groupRows(names, allowSingles) {
        var rows = [];
        var buffer = [];
        function flush() {
          if (buffer.length) {
            rows.push(buffer);
            buffer = [];
          }
        }
        for (var i = 0; i < names.length; i += 1) {
          if (allowSingles && !isTall(names[i])) {
            flush();
            rows.push([names[i]]);
          } else {
            buffer.push(names[i]);
            if (buffer.length === 2) flush();
          }
        }
        flush();
        return rows;
      }

      function assignSlots(names) {
        if (!names.length) return;
        function get(i) { return 'assets/getphoto/' + names[i % names.length]; }
        var hero = document.querySelectorAll('.photo-hero__image img');
        var bg = document.querySelectorAll('.photo-statement__background-image img');
        var cards = document.querySelectorAll('.photo-statement__floating-card img');
        for (var i = 0; i < hero.length; i += 1) swapWhenReady(hero[i], get(i));
        for (var i = 0; i < bg.length; i += 1) swapWhenReady(bg[i], get(i < 3 ? i : 3));
        for (var i = 0; i < cards.length; i += 1) swapWhenReady(cards[i], get(4 + i));
      }

      function build(list) {
        if (!canvas) return;
        var names = orderedNames(toNames(list));
        if (!names.length) return;

        while (canvas.firstChild) canvas.removeChild(canvas.firstChild);

        var photos = names.filter(function (name) {
          return !/\.gif$/i.test(name);
        });
        var gifs = names.filter(function (name) {
          return /\.gif$/i.test(name);
        });

        var index = 0;
        function appendRow(group) {
          var isGif = /\.gif$/i.test(group[0]);
          var row = document.createElement('div');
          row.className = 'photographyImageGrid__row cols-' + group.length;
          group.forEach(function (name) {
            row.appendChild(makeCard(name, index, isGif));
            index += 1;
          });
          canvas.appendChild(row);
        }

        groupRows(photos, true).forEach(appendRow);

        if (gifs.length) {
          var divider = document.createElement('h3');
          divider.className = 'photographyImageGrid__divider';
          divider.textContent = 'GIF 动图';
          canvas.appendChild(divider);

          var gifRow = document.createElement('div');
          gifRow.className = 'photographyImageGrid__row photographyImageGrid__row--gif';
          gifs.forEach(function (name) {
            gifRow.appendChild(makeCard(name, index, true));
            index += 1;
          });
          canvas.appendChild(gifRow);
        }

        assignSlots(names);
      }

      build(fallbackFiles);

      window.__photoDynamic = new Promise(function (resolve) {
        var settled = false;
        function finish() {
          if (settled) return;
          settled = true;
          resolve();
        }
        function refresh(data) {
          if (settled) return;
          var names = toNames(data);
          var same = names.length === fallbackFiles.length &&
            names.every(function (name, index) { return name === fallbackFiles[index]; });
          if (!same && names.length) build(data);
        }
        fetch('https://api.github.com/repos/daming-ld/daming-ld.github.io/contents/assets/getphoto?ref=main', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('http ' + response.status);
            return response.json();
          })
          .then(function (data) { refresh(data); finish(); })
          .catch(function () { finish(); });
        setTimeout(finish, 5000);
      });
    })();
  </script>

  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/prefetch.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js" defer></script>
  <script src="assets/js/photo.js" defer></script>
</body>
</html>
