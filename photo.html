        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'photographyImageGridItem visible photo-grid-item--full';
        button.setAttribute('data-photo-card', '');
        button.setAttribute('data-index', String(index));
        button.setAttribute('data-photo-title', '影像 ' + String(index + 3).padStart(2, '0'));
        button.setAttribute('data-photo-category', '日常记录 2026');
        button.setAttribute('data-photo-description', '收录于 Daming 影像档案。');
        button.setAttribute('data-photo-src', 'assets/getphoto/' + name);
        button.setAttribute('aria-label', 'View image ' + (index + 3));
        button.style.setProperty('--photo-column', String(column));
        button.style.setProperty('--photo-span', '2');
        button.style.setProperty('align-self', 'start');

        var image = document.createElement('img');
        image.className = 'image useFade loaded photographyImageGridItem__image fill';
        image.src = 'assets/getphoto/' + name;
        image.alt = '';
        image.loading = 'lazy';
        image.draggable = 'false';
        if (knownDimensions[name]) {
          image.width = knownDimensions[name][0];
          image.height = knownDimensions[name][1];
          button.style.aspectRatio = knownDimensions[name][0] + '/' + knownDimensions[name][1];
        } else {
          image.addEventListener('load', function () {
            if (image.naturalWidth) button.style.aspectRatio = image.naturalWidth + '/' + image.naturalHeight;
          });
        }

        var parallaxInner = document.createElement('div');
        parallaxInner.className = 'parallax__inner';
        parallaxInner.appendChild(image);
        var parallax = document.createElement('div');
        parallax.className = 'parallax';
        parallax.appendChild(parallaxInner);
        var inner = document.createElement('div');
        inner.className = 'photographyImageGridItem__inner fill';
        inner.appendChild(parallax);
        var draggable = document.createElement('div');
        draggable.className = 'draggableElement photographyImageGridItem__draggable fill';
        draggable.appendChild(inner);
        button.appendChild(draggable);
        return button;
      }

      function build(list) {
        if (!canvas || !list || !Array.isArray(list) || !list.length) return;

        var names = list.filter(function (item) {
          return /\.(jpg|gif)$/i.test(item.name);
        }).map(function (item) {
          return item.name;
        }).sort(function (a, b) {
          return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0);
        });
        if (!names.length) return;

        Array.prototype.forEach.call(canvas.querySelectorAll('.photographyImageGrid__row'), function (row) {
          var hasDynamic = Array.prototype.some.call(row.querySelectorAll('[data-photo-card]'), function (card) {
            return (parseInt(card.dataset.index, 10) || 0) >= 12;
          });
          if (hasDynamic) row.parentNode.removeChild(row);
        });

        for (var i = 0; i < names.length; i += 2) {
          var row = document.createElement('div');
          row.className = 'photographyImageGrid__row';
          for (var j = 0; j < 2 && (i + j) < names.length; j += 1) {
            row.appendChild(makeCard(names[i + j], 12 + i + j));
          }
          canvas.appendChild(row);
        }
      }

      window.__photoDynamic = new Promise(function (resolve) {
        var settled = false;
        function finish() {
          if (settled) return;
          settled = true;
          resolve();
        }
        fetch('https://api.github.com/repos/daming-ld/daming-ld.github.io/contents/assets/getphoto?ref=main', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('http ' + response.status);
            return response.json();
          })
          .then(function (data) { build(data); finish(); })
          .catch(function () { finish(); });
        setTimeout(finish, 5000);
      });
    })();
  </script>

  <script src="assets/js/prefetch.js" defer></script>

  <script src="assets/js/photo.js" defer></script>
