        <figure class="photo-hero__image photo-hero__image--1">
          <img src="assets/images/photos/bg_1.webp" alt="" width="1024" height="1024" fetchpriority="high">
        </figure>
        <figure class="photo-hero__image photo-hero__image--2">
          <img src="assets/images/photos/bg_2.webp" alt="" width="1024" height="1024" fetchpriority="auto">
        </figure>
        <figure class="photo-hero__image photo-hero__image--3">
          <img src="assets/images/photos/bg_3.webp" alt="" width="1024" height="1024" fetchpriority="auto">

  <dialog class="photo-dialog" data-photo-dialog aria-labelledby="photo-dialog-title">
    <button class="photo-dialog__close" type="button" data-photo-close aria-label="关闭作品查看器">×</button>
    <div class="photo-dialog__content">
      <div class="photo-dialog__image-wrap">
        <img class="photo-dialog__image" data-photo-dialog-image src="" alt="" role="button" tabindex="0" draggable="false">
      </div>
      <div class="photo-dialog__info">
        <p data-photo-dialog-count>01 / 49</p>
        <h2 id="photo-dialog-title" data-photo-dialog-title></h2>
        <p data-photo-dialog-category></p>
        <p data-photo-dialog-description></p>
      </div>
    </div>
    <div class="photo-dialog__controls">
      <button type="button" data-photo-previous aria-label="查看上一件作品">←</button>
