<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>文章列表 | Daming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var bg = localStorage.getItem('site-bg');
                if (bg) document.documentElement.setAttribute('data-bg', bg);
            } catch (e) { }
        })();
    </script>
    <link rel="preload" href="assets/css/style.css" as="style">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="star-canvas-page" data-section="posts">
    <div data-site-nav></div>

    <div class="page-container">
        <div class="page-shell has-sidebar">
            <div class="glass-card page-main-card">
                <h1>文章列表</h1>
                <div class="page-content">
                    <form class="post-search" role="search">
                        <label class="post-search__label" for="post-search-input">搜索文章</label>
                        <input class="post-search__input" id="post-search-input" type="text" role="searchbox" placeholder="搜索标题、作者或标签" inputmode="search" enterkeyhint="search" autocomplete="off">
                        <button class="post-search__clear" type="reset" aria-label="清除搜索">清除</button>
                    </form>
                    <p class="post-search__status" id="post-search-status" aria-live="polite"></p>

                    <ul class="post-list" id="post-list" aria-label="文章列表"></ul>

                    <nav class="post-pagination" id="post-pagination" aria-label="文章分页" hidden>
                        <button class="post-pagination__button post-pagination__button--prev" id="post-pagination-prev" type="button">上一页</button>
                        <span class="post-pagination__current" id="post-pagination-current" aria-live="polite"></span>
                        <button class="post-pagination__button post-pagination__button--next" id="post-pagination-next" type="button">下一页</button>
                    </nav>
                    <p class="post-search__empty" id="post-search-empty" hidden>没有找到匹配的文章。</p>
                </div>
            </div>

            <div class="sidebar-wrapper">
                <aside class="glass-card page-aside-card">
                    <h2>全部文章</h2>
                    <div class="page-content">
                        <div class="aside-mini-card">
                            <p>当前共有 <strong id="post-count">0</strong> 篇文章。</p>
                            <p>最新文章日期：<strong id="latest-date"></strong></p>
                        </div>
                    </div>
                </aside>
                <aside class="glass-card page-aside-card">
                    <h2>标签</h2>
                    <div class="page-content">
                        <div class="tags-list" id="tag-list"></div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/nav-component.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/prefetch.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const scrollContainer = document.getElementById('tags-scroll');
            let tagItems = document.querySelectorAll('.tag-list-item');
            let postItems = document.querySelectorAll('.post-item');
            const asideTitle = document.querySelector('.page-aside-card h2');
            const postCount = document.getElementById('post-count');
            const latestDate = document.getElementById('latest-date');
            const searchForm = document.querySelector('.post-search');
            const searchInput = document.getElementById('post-search-input');
            const searchStatus = document.getElementById('post-search-status');
            const emptyState = document.getElementById('post-search-empty');
            const pagination = document.getElementById('post-pagination');
            const previousPageButton = document.getElementById('post-pagination-prev');
            const nextPageButton = document.getElementById('post-pagination-next');
            const currentPageLabel = document.getElementById('post-pagination-current');
            const originalTitle = asideTitle ? asideTitle.textContent : '全部文章';
            const pageSize = 20;
            const contextStorageKey = 'post-list-context';
            let activeTag = null;
            let currentPage = 1;

            const POST_FILES = [
                '2026-07-19-真理通途.md',
                '2026-05-21-世界的真理_V1.md',
                '2026-05-11-黑洞吞噬天地真菌.md',
                '2026-04-11-岩主天星座下没钱弟子.md',
                '2025-12-18-掐头去尾第一篇.md',
                '2025-12-11-未命名.md',
                '2025-12-07-强风背头第四篇.md',
                '2025-11-25-酒后胡言第二篇.md',
                '2025-11-20-机械飞升第三篇.md'
            ];

            function parsePostMarkdown(text) {
                const parsed = { title: '', date: '', tags: [], content: text };
                const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text);
                if (!match) return parsed;
                parsed.content = match[2];
                match[1].split(/\r?\n/).forEach(function (line) {
                    const colon = line.indexOf(':');
                    if (colon <= 0) return;
                    const key = line.slice(0, colon).trim();
                    let value = line.slice(colon + 1).trim().replace(/^["']|["']$/g, '').trim();
                    if (key === 'title') {
                        parsed.title = value;
                    } else if (key === 'date') {
                        parsed.date = value.slice(0, 10);
                    } else if (key === 'tags' || key === 'categories') {
                        value.split(/[,，、\s]+/).forEach(function (tag) {
                            tag = tag.trim();
                            if (tag && parsed.tags.indexOf(tag) === -1) { parsed.tags.push(tag); }
                        });
                    }
                });
                return parsed;
            }

            function extractExcerpt(content) {
                const paragraphs = content.split(/\r?\n\s*\r?\n/);
                let fallback = '';
                for (let i = 0; i < paragraphs.length; i++) {
                    const lines = paragraphs[i].split(/\r?\n/).map(function (line) {
                        return line
                            .replace(/^#{1,6}\s*/, '')
                            .replace(/^>\s?/, '')
                            .replace(/^[-*+]\s+/, '')
                            .replace(/^\d+[.、)]\s*/, '')
                            .replace(/[*_~`]/g, '')
                            .trim();
                    }).filter(Boolean);
                    if (!lines.length) continue;
                    const text = lines.join(' ');
                    if (!fallback) { fallback = text; }
                    if (text.length >= 10) {
                        return text.length > 130 ? text.slice(0, 130).replace(/\s+\S*$/, '') + '……' : text;
                    }
                }
                return fallback.length > 130 ? fallback.slice(0, 130).replace(/\s+\S*$/, '') + '……' : fallback;
            }

            function formatPostDate(dateStr) {
                if (!dateStr) return '';
                const parts = String(dateStr).split('-');
                return (parts[0] || '') + '年' + (parts[1] || '01') + '月' + (parts[2] || '01') + '日';
            }

            function renderPost(post) {
                const list = document.getElementById('post-list');
                if (!list) return;
                const item = document.createElement('li');
                item.className = 'post-item';
                item.setAttribute('data-title', post.title);
                item.setAttribute('data-author', post.author || '');
                item.setAttribute('data-tags', post.tags.join(','));
                const link = document.createElement('a');
                link.href = 'post.html?file=' + encodeURIComponent(post.file);
                const title = document.createElement('div');
                title.className = 'post-title';
                title.textContent = post.title;
                link.appendChild(title);
                const meta = document.createElement('div');
                meta.className = 'post-meta';
                const time = document.createElement('time');
                time.className = 'post-date';
                time.textContent = formatPostDate(post.date);
                meta.appendChild(time);
                if (post.author) {
                    const authorSpan = document.createElement('span');
                    authorSpan.className = 'post-author';
                    authorSpan.textContent = ' · ' + post.author;
                    meta.appendChild(authorSpan);
                }
                link.appendChild(meta);
                if (post.excerpt) {
                    const excerpt = document.createElement('p');
                    excerpt.className = 'post-excerpt';
                    excerpt.textContent = post.excerpt;
                    link.appendChild(excerpt);
                }
                item.appendChild(link);
                list.appendChild(item);
            }

            function renderTagList(tagCounts) {
                const container = document.getElementById('tag-list');
                if (!container) return;
                Object.keys(tagCounts).sort().forEach(function (tag) {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'tag-list-item';
                    chip.setAttribute('data-tag', tag);
                    chip.textContent = tag;
                    container.appendChild(chip);
                });
            }

            async function loadPosts() {
                const list = document.getElementById('post-list');
                if (!list) return;
                const posts = [];
                const tagCounts = {};
                await Promise.all(POST_FILES.map(function (file) {
                    return fetch('_posts/' + encodeURIComponent(file), { cache: 'no-cache' }).then(function (response) {
                        if (!response.ok) return null;
                        return response.text();
                    }).catch(function () { return null; });
                })).then(function (results) {
                    results.forEach(function (text, index) {
                        if (!text) return;
                        const file = POST_FILES[index];
                        const parsed = parsePostMarkdown(text);
                        const post = {
                            file: file,
                            title: parsed.title || file.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, ''),
                            date: parsed.date,
                            tags: parsed.tags,
                            excerpt: extractExcerpt(parsed.content)
                        };
                        posts.push(post);
                        parsed.tags.forEach(function (tag) { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
                    });
                });
                posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
                posts.forEach(renderPost);
                renderTagList(tagCounts);
            }

            function updateTagHighlights() {
                tagItems.forEach(function (item) {
                    item.classList.toggle('active', item.getAttribute('data-tag') === activeTag);
                });
            }

            function saveContext(matchingPosts) {
                try {
                    sessionStorage.setItem(contextStorageKey, JSON.stringify({
                        query: searchInput ? searchInput.value : '',
                        activeTag: activeTag,
                        currentPage: currentPage,
                        posts: matchingPosts.map(function (post) {
                            const link = post.querySelector('a');
                            return { title: post.getAttribute('data-title') || '', url: link ? link.href : '' };
                        })
                    }));
                } catch (error) {}
            }

            function readContext() {
                try {
                    const context = JSON.parse(sessionStorage.getItem(contextStorageKey));
                    return context && Array.isArray(context.posts) ? context : null;
                } catch (error) { return null; }
            }

            function applyFilters() {
                const query = searchInput ? searchInput.value.trim().toLocaleLowerCase() : '';
                let visibleCount = 0;
                let newestDate = '';
                const matchingPosts = [];
                postItems.forEach(function (post) {
                    const postTags = post.getAttribute('data-tags') || '';
                    const searchableText = [post.getAttribute('data-title'), post.getAttribute('data-author'), postTags].join(' ').toLocaleLowerCase();
                    const matchesTag = !activeTag || postTags.split(',').includes(activeTag);
                    const matchesQuery = !query || searchableText.includes(query);
                    const isVisible = matchesTag && matchesQuery;
                    if (isVisible) {
                        matchingPosts.push(post);
                        visibleCount++;
                        const postDate = post.querySelector('.post-date');
                        if (postDate && (!newestDate || postDate.textContent > newestDate)) { newestDate = postDate.textContent; }
                    }
                });
                const totalPages = Math.ceil(visibleCount / pageSize);
                if (currentPage > totalPages) { currentPage = totalPages || 1; }
                const firstPostIndex = (currentPage - 1) * pageSize;
                const lastPostIndex = firstPostIndex + pageSize;
                postItems.forEach(function (post) {
                    const matchedIndex = matchingPosts.indexOf(post);
                    post.hidden = matchedIndex < firstPostIndex || matchedIndex >= lastPostIndex;
                });
                if (asideTitle) { asideTitle.textContent = activeTag || originalTitle; }
                if (postCount) { postCount.textContent = visibleCount; }
                if (latestDate) { latestDate.textContent = visibleCount ? newestDate : ''; }
                if (emptyState) { emptyState.hidden = visibleCount !== 0; }
                if (searchStatus) { searchStatus.textContent = query ? '找到 ' + visibleCount + ' 篇匹配文章' : ''; }
                if (pagination) { pagination.hidden = totalPages <= 1; }
                if (currentPageLabel) { currentPageLabel.textContent = totalPages ? currentPage + '/' + totalPages : ''; }
                if (previousPageButton) { previousPageButton.disabled = currentPage === 1; }
                if (nextPageButton) { nextPageButton.disabled = currentPage === totalPages || totalPages === 0; }
                saveContext(matchingPosts);
            }

            await loadPosts();
            tagItems = document.querySelectorAll('.tag-list-item');
            postItems = document.querySelectorAll('.post-item');

            if (scrollContainer) {
                const totalTags = 0;
                const scrollHeight = scrollContainer.scrollHeight;
                const singleSetHeight = scrollHeight / 3;
                scrollContainer.scrollTop = singleSetHeight;
                let isResetting = false;
                scrollContainer.addEventListener('scroll', function () {
                    if (isResetting) return;
                    const scrollTop = scrollContainer.scrollTop;
                    if (scrollTop >= singleSetHeight * 2 - 10) {
                        isResetting = true;
                        scrollContainer.scrollTop = scrollTop - singleSetHeight;
                        isResetting = false;
                    } else if (scrollTop <= 10) {
                        isResetting = true;
                        scrollContainer.scrollTop = scrollTop + singleSetHeight;
                        isResetting = false;
                    }
                });
            }

            tagItems.forEach(function (item) {
                item.addEventListener('click', function () {
                    const tag = this.getAttribute('data-tag');
                    activeTag = (activeTag === tag) ? null : tag;
                    updateTagHighlights();
                    currentPage = 1;
                    applyFilters();
                });
            });

            if (searchInput) {
                searchInput.addEventListener('input', function () { currentPage = 1; applyFilters(); });
            }
            if (searchForm) {
                searchForm.addEventListener('submit', function (event) { event.preventDefault(); });
                searchForm.addEventListener('reset', function () {
                    window.setTimeout(function () { currentPage = 1; applyFilters(); }, 0);
                });
            }
            if (previousPageButton) {
                previousPageButton.addEventListener('click', function () {
                    if (!previousPageButton.disabled && currentPage > 1) { currentPage--; applyFilters(); }
                });
            }
            if (nextPageButton) {
                nextPageButton.addEventListener('click', function () {
                    if (!nextPageButton.disabled) { currentPage++; applyFilters(); }
                });
            }

            const savedContext = readContext();
            if (savedContext) {
                if (searchInput) { searchInput.value = savedContext.query || ''; }
                activeTag = savedContext.activeTag || null;
                currentPage = Number.isInteger(savedContext.currentPage) ? savedContext.currentPage : 1;
                updateTagHighlights();
            }
            applyFilters();
        });
    </script>
</body>

</html>
