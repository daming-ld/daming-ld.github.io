<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>文章列表 | Daming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var bg = localStorage.getItem('site-bg');
                if (bg) document.documentElement.setAttribute('data-bg', bg);
            } catch (e) { }
        })();
    </script>
    <link rel="preload" href="assets/css/style.css" as="style">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="star-canvas-page" data-section="posts">
    <div data-site-nav></div>

    <div class="page-container">
        <div class="page-shell has-sidebar">
            <div class="glass-card page-main-card">
                <h1>文章列表</h1>
                <div class="page-content">
                    <form class="post-search" role="search">
                        <label class="post-search__label" for="post-search-input">搜索文章</label>
                        <svg class="post-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                        </svg>
                        <input class="post-search__input" id="post-search-input" type="text" role="searchbox" placeholder="搜索标题、作者或标签" inputmode="search" enterkeyhint="search" autocomplete="off">
                        <button class="post-search__clear" type="reset" aria-label="清除搜索">清除</button>
                    </form>
                    <p class="post-search__status" id="post-search-status" aria-live="polite"></p>

                    <ul class="post-list" id="post-list" aria-label="文章列表"></ul>

                    <nav class="post-pagination" id="post-pagination" aria-label="文章分页" hidden>
                        <button class="post-pagination__button post-pagination__button--prev" id="post-pagination-prev" type="button">上一页</button>
                        <span class="post-pagination__current" id="post-pagination-current" aria-live="polite"></span>
                        <button class="post-pagination__button post-pagination__button--next" id="post-pagination-next" type="button">下一页</button>
                    </nav>
                    <p class="post-search__empty" id="post-search-empty" hidden>没有找到匹配的文章。</p>
                </div>
            </div>

            <div class="sidebar-wrapper">
                <aside class="glass-card page-aside-card">
                    <h2>全部文章</h2>
                    <div class="page-content">
                        <div class="aside-mini-card">
                            <p>当前共有 <strong id="post-count">0</strong> 篇文章。</p>
                            <p>最新文章日期：<strong id="latest-date"></strong></p>
                        </div>
                        <h3 class="category-list-title">分类</h3>
                        <div class="tags-list" id="category-list"></div>
                    </div>
                </aside>
                <aside class="glass-card page-aside-card">
                    <h2>标签</h2>
                    <div class="page-content">
                        <div class="tags-list" id="tag-list"></div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/nav-component.js" defer></script>
    <script src="assets/js/flashlight.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/prefetch.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const scrollContainer = document.getElementById('tags-scroll');
            let tagItems = document.querySelectorAll('.tag-list-item:not(.category-list-item)');
            let categoryItems = document.querySelectorAll('.category-list-item');
            let postItems = document.querySelectorAll('.post-item');
            const asideTitle = document.querySelector('.page-aside-card h2');
            const postCount = document.getElementById('post-count');
            const latestDate = document.getElementById('latest-date');
            const searchForm = document.querySelector('.post-search');
            const searchInput = document.getElementById('post-search-input');
            const searchStatus = document.getElementById('post-search-status');
            const emptyState = document.getElementById('post-search-empty');
            const pagination = document.getElementById('post-pagination');
            const previousPageButton = document.getElementById('post-pagination-prev');
            const nextPageButton = document.getElementById('post-pagination-next');
            const currentPageLabel = document.getElementById('post-pagination-current');
            const originalTitle = asideTitle ? asideTitle.textContent : '全部文章';
            const pageSize = 8;
            const contextStorageKey = 'post-list-context';
            let activeTag = null;
            let activeCategory = null;
            let currentPage = 1;

            const FALLBACK_POST_FILES = [
                '角色DLC_V1.0.md',
                '伤害DLC.md',
                '空域特制DLC_V1.0.md',
                '真理通途DLC_V1.1.md',
                '灵魂工艺DLC_V1.0.md',
                '万古洪荒DLC_V1.0.md',
                '人物-其一_DLC.md',
                '地区-其一_DLC.md',
                '世界的真理_V1.0.md',
                '黑洞吞噬天地真菌.md',
                '岩主天星座下没钱弟子.md',
                '掐头去尾第一篇.md',
                '未命名.md',
                '强风背头第四篇.md',
                '酒后胡言第二篇.md',
                '机械飞升第三篇.md'
            ];

            function getRepo() {
                const host = String(window.location.hostname || '').replace(/^www\./, '');
                if (host.endsWith('.github.io')) {
                    return { owner: host.split('.')[0], repo: host };
                }
                return { owner: 'daming-ld', repo: 'daming-ld.github.io' };
            }

            async function discoverPostFiles() {
                const repo = getRepo();
                const files = new Set();
                FALLBACK_POST_FILES.forEach(function (file) { files.add(file); });
                try {
                    const response = await fetch('https://api.github.com/repos/' + encodeURIComponent(repo.owner) + '/' + encodeURIComponent(repo.repo) + '/contents/_posts', {
                        headers: { 'Accept': 'application/vnd.github+json' }
                    });
                    if (response.ok) {
                        const items = await response.json();
                        items.forEach(function (item) {
                            if (item.type === 'file' && /\.md$/i.test(item.name)) { files.add(item.name); }
                        });
                    }
                } catch (error) { }
                return Array.from(files);
            }

            function parsePostMarkdown(text) {
                const parsed = { title: '', date: '', tags: [], content: text };
                const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text);
                if (!match) return parsed;
                parsed.content = match[2];
                match[1].split(/\r?\n/).forEach(function (line) {
                    const colon = line.indexOf(':');
                    if (colon <= 0) return;
                    const key = line.slice(0, colon).trim();
                    let value = line.slice(colon + 1).trim().replace(/^\[|\]$/g, '').replace(/^["']|["']$/g, '').trim();
                    if (key === 'title') {
                        parsed.title = value;
                    } else if (key === 'date') {
                        parsed.date = value.slice(0, 10);
                    } else if (key === 'category') {
                        parsed.category = value;
                    } else if (key === 'tags') {
                        value.split(/[,，、\s]+/).forEach(function (tag) {
                            tag = tag.trim().replace(/^["']|["']$/g, '');
                            if (tag && parsed.tags.indexOf(tag) === -1) { parsed.tags.push(tag); }
                        });
                    }
                });
                return parsed;
            }

            function extractExcerpt(content) {
                const paragraphs = content.split(/\r?\n\s*\r?\n/);
                let fallback = '';
                for (let i = 0; i < paragraphs.length; i++) {
                    const lines = paragraphs[i].split(/\r?\n/).map(function (line) {
                        return line
                            .replace(/^#{1,6}\s*/, '')
                            .replace(/^>\s?/, '')
                            .replace(/^[-*+]\s+/, '')
                            .replace(/^\d+[.、)]\s*/, '')
                            .replace(/[*_~`]/g, '')
                            .trim();
                    }).filter(Boolean);
                    if (!lines.length) continue;
                    const text = lines.join(' ');
                    if (!fallback) { fallback = text; }
                    if (text.length >= 10) {
                        return text.length > 130 ? text.slice(0, 130).replace(/\s+\S*$/, '') + '……' : text;
                    }
                }
                return fallback.length > 130 ? fallback.slice(0, 130).replace(/\s+\S*$/, '') + '……' : fallback;
            }

            function formatPostDate(dateStr) {
                if (!dateStr) return '';
                const parts = String(dateStr).split('-');
                return (parts[0] || '') + '年' + (parts[1] || '01') + '月' + (parts[2] || '01') + '日';
            }

            function renderPost(post) {
                const list = document.getElementById('post-list');
                if (!list) return;
                const item = document.createElement('li');
                item.className = 'post-item';
                item.setAttribute('data-title', post.title);
                item.setAttribute('data-author', post.author || '');
                item.setAttribute('data-tags', post.tags.join(','));
                item.setAttribute('data-category', post.category || '');
                const link = document.createElement('a');
                link.href = 'post.html?file=' + encodeURIComponent(post.file);
                const title = document.createElement('div');
                title.className = 'post-title';
                title.textContent = post.title;
                link.appendChild(title);
                const meta = document.createElement('div');
                meta.className = 'post-meta';
                if (post.category) {
                    const categorySpan = document.createElement('span');
                    categorySpan.className = 'post-category';
                    categorySpan.textContent = post.category;
                    meta.appendChild(categorySpan);
                }
                const time = document.createElement('time');
                time.className = 'post-date';
                time.textContent = formatPostDate(post.date);
                meta.appendChild(time);
                if (post.author) {
                    const authorSpan = document.createElement('span');
                    authorSpan.className = 'post-author';
                    authorSpan.textContent = ' · ' + post.author;
                    meta.appendChild(authorSpan);
                }
                link.appendChild(meta);
                if (post.tags.length) {
                    const tagsDiv = document.createElement('div');
                    tagsDiv.className = 'post-tags';
                    post.tags.forEach(function (tag) {
                        const span = document.createElement('span');
                        span.className = 'tag';
                        span.textContent = tag;
                        tagsDiv.appendChild(span);
                    });
                    link.appendChild(tagsDiv);
                }
                item.appendChild(link);
                list.appendChild(item);
            }

            function renderTagList(tagCounts) {
                const container = document.getElementById('tag-list');
                if (!container) return;
                Object.keys(tagCounts).sort().forEach(function (tag) {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'tag-list-item';
                    chip.setAttribute('data-tag', tag);
                    chip.textContent = tag;
                    container.appendChild(chip);
                });
            }

            const CATEGORY_ORDER = ['正文', '散件', '（世界）合订本/DLC', '设定'];

            function renderCategoryList(categoryCounts) {
                const container = document.getElementById('category-list');
                if (!container) return;
                Object.keys(categoryCounts).sort(function (a, b) {
                    const ai = CATEGORY_ORDER.indexOf(a);
                    const bi = CATEGORY_ORDER.indexOf(b);
                    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
                }).forEach(function (name) {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'tag-list-item category-list-item';
                    chip.setAttribute('data-category', name);
                    chip.textContent = name + ' (' + categoryCounts[name] + ')';
                    container.appendChild(chip);
                });
            }

            const POSTS_CACHE_KEY = 'posts-cache-v4';
            const POSTS_CACHE_TTL = 5 * 60 * 1000;

            function loadCachedPosts() {
                try {
                    const raw = localStorage.getItem(POSTS_CACHE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (!data || typeof data.savedAt !== 'number' || !Array.isArray(data.posts)) return null;
                    return data;
                } catch (e) { return null; }
            }

            function saveCachedPosts(posts) {
                try {
                    localStorage.setItem(POSTS_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), posts: posts }));
                } catch (e) { }
            }

            function samePosts(a, b) {
                if (a.length !== b.length) return false;
                for (let i = 0; i < a.length; i++) {
                    if (a[i].file !== b[i].file ||
                        a[i].title !== b[i].title ||
                        a[i].date !== b[i].date ||
                        a[i].category !== b[i].category ||
                        (a[i].tags || []).join('|') !== (b[i].tags || []).join('|')) {
                        return false;
                    }
                }
                return true;
            }

            function renderPosts(posts) {
                const list = document.getElementById('post-list');
                if (!list) return;
                list.innerHTML = '';
                const tagList = document.getElementById('tag-list');
                if (tagList) { tagList.innerHTML = ''; }
                const categoryList = document.getElementById('category-list');
                if (categoryList) { categoryList.innerHTML = ''; }
                const tagCounts = {};
                const categoryCounts = {};
                posts.forEach(function (post) {
                    renderPost(post);
                    post.tags.forEach(function (tag) { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
                    if (post.category) { categoryCounts[post.category] = (categoryCounts[post.category] || 0) + 1; }
                });
                renderTagList(tagCounts);
                renderCategoryList(categoryCounts);
            }

            function buildPostFromMarkdown(text, file) {
                const parsed = parsePostMarkdown(text);
                return {
                    file: file,
                    title: parsed.title || file.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, ''),
                    date: parsed.date,
                    category: parsed.category || '',
                    tags: parsed.tags,
                    excerpt: extractExcerpt(parsed.content)
                };
            }

            function fetchPostText(file) {
                return fetch('_posts/' + encodeURIComponent(file), { cache: 'no-cache' }).then(function (response) {
                    if (!response.ok) return null;
                    return response.text();
                }).catch(function () { return null; });
            }

            async function loadPostsFromIndex() {
                try {
                    const response = await fetch('posts.json', { cache: 'no-cache' });
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (!Array.isArray(data) || !data.length) return null;
                    return data.filter(function (item) {
                        return item && item.file;
                    }).map(function (item) {
                        return {
                            file: item.file,
                            title: item.title || item.file.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, ''),
                            date: item.date || '',
                            category: item.category || '',
                            tags: Array.isArray(item.tags) ? item.tags : []
                        };
                    });
                } catch (e) {
                    return null;
                }
            }

            async function loadPostsFromRepo() {
                const postFiles = await discoverPostFiles();
                const posts = [];
                await Promise.all(postFiles.map(function (file) {
                    return fetchPostText(file);
                })).then(function (results) {
                    results.forEach(function (text, index) {
                        if (!text) return;
                        posts.push(buildPostFromMarkdown(text, postFiles[index]));
                    });
                });
                return posts;
            }

            async function reconcileIndexPosts(posts) {
                try {
                    const postFiles = await discoverPostFiles();
                    const known = {};
                    posts.forEach(function (post) { known[post.file] = true; });
                    const missing = postFiles.filter(function (file) { return !known[file]; });
                    if (!missing.length) return posts;
                    const added = [];
                    await Promise.all(missing.map(function (file) {
                        return fetchPostText(file).then(function (text) {
                            if (text) added.push(buildPostFromMarkdown(text, file));
                        });
                    }));
                    return posts.concat(added);
                } catch (e) {
                    return posts;
                }
            }

            async function loadPosts() {
                const list = document.getElementById('post-list');
                if (!list) return;

                const cached = loadCachedPosts();
                if (cached && cached.posts.length) {
                    renderPosts(cached.posts);
                }
                if (cached && Date.now() - cached.savedAt < POSTS_CACHE_TTL) {
                    return;
                }

                let posts = await loadPostsFromIndex();
                if (!posts) {
                    posts = await loadPostsFromRepo();
                    if (!posts || !posts.length) { return; }
                    posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
                    saveCachedPosts(posts);
                    if (!cached || !samePosts(posts, cached.posts)) {
                        renderPosts(posts);
                    }
                    return;
                }

                posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
                saveCachedPosts(posts);
                if (!cached || !samePosts(posts, cached.posts)) {
                    renderPosts(posts);
                }

                reconcileIndexPosts(posts).then(function (merged) {
                    merged.sort(function (a, b) { return b.date.localeCompare(a.date); });
                    if (!samePosts(merged, posts)) {
                        saveCachedPosts(merged);
                        renderPosts(merged);
                    }
                });
            }

            function updateTagHighlights() {
                tagItems.forEach(function (item) {
                    item.classList.toggle('active', item.getAttribute('data-tag') === activeTag);
                });
            }

            function updateCategoryHighlights() {
                categoryItems.forEach(function (item) {
                    item.classList.toggle('active', item.getAttribute('data-category') === activeCategory);
                });
            }

            function saveContext(matchingPosts) {
                try {
                    sessionStorage.setItem(contextStorageKey, JSON.stringify({
                        query: searchInput ? searchInput.value : '',
                        activeTag: activeTag,
                        activeCategory: activeCategory,
                        currentPage: currentPage,
                        posts: matchingPosts.map(function (post) {
                            const link = post.querySelector('a');
                            return { title: post.getAttribute('data-title') || '', url: link ? link.href : '' };
                        })
                    }));
                } catch (error) {}
            }

            function readContext() {
                try {
                    const context = JSON.parse(sessionStorage.getItem(contextStorageKey));
                    return context && Array.isArray(context.posts) ? context : null;
                } catch (error) { return null; }
            }

            function applyFilters() {
                const query = searchInput ? searchInput.value.trim().toLocaleLowerCase() : '';
                let visibleCount = 0;
                let newestDate = '';
                const matchingPosts = [];
                postItems.forEach(function (post) {
                    const postTags = post.getAttribute('data-tags') || '';
                    const postCategory = post.getAttribute('data-category') || '';
                    const searchableText = [post.getAttribute('data-title'), post.getAttribute('data-author'), postCategory, postTags].join(' ').toLocaleLowerCase();
                    const matchesTag = !activeTag || postTags.split(',').includes(activeTag);
                    const matchesCategory = !activeCategory || postCategory === activeCategory;
                    const matchesQuery = !query || searchableText.includes(query);
                    const isVisible = matchesTag && matchesCategory && matchesQuery;
                    if (isVisible) {
                        matchingPosts.push(post);
                        visibleCount++;
                        const postDate = post.querySelector('.post-date');
                        if (postDate && (!newestDate || postDate.textContent > newestDate)) { newestDate = postDate.textContent; }
                    }
                });
                const totalPages = Math.ceil(visibleCount / pageSize);
                if (currentPage > totalPages) { currentPage = totalPages || 1; }
                const firstPostIndex = (currentPage - 1) * pageSize;
                const lastPostIndex = firstPostIndex + pageSize;
                postItems.forEach(function (post) {
                    const matchedIndex = matchingPosts.indexOf(post);
                    post.hidden = matchedIndex < firstPostIndex || matchedIndex >= lastPostIndex;
                });
                if (asideTitle) {
                    asideTitle.textContent = (activeCategory && activeTag) ? activeCategory + ' / ' + activeTag : (activeCategory || activeTag || originalTitle);
                }
                if (postCount) { postCount.textContent = visibleCount; }
                if (latestDate) { latestDate.textContent = visibleCount ? newestDate : ''; }
                if (emptyState) { emptyState.hidden = visibleCount !== 0; }
                if (searchStatus) { searchStatus.textContent = query ? '找到 ' + visibleCount + ' 篇匹配文章' : ''; }
                if (pagination) { pagination.hidden = totalPages <= 1; }
                if (currentPageLabel) { currentPageLabel.textContent = totalPages ? currentPage + '/' + totalPages : ''; }
                if (previousPageButton) { previousPageButton.disabled = currentPage === 1; }
                if (nextPageButton) { nextPageButton.disabled = currentPage === totalPages || totalPages === 0; }
                saveContext(matchingPosts);
            }

            await loadPosts();
            tagItems = document.querySelectorAll('.tag-list-item:not(.category-list-item)');
            categoryItems = document.querySelectorAll('.category-list-item');
            postItems = document.querySelectorAll('.post-item');

            if (scrollContainer) {
                const totalTags = 0;
                const scrollHeight = scrollContainer.scrollHeight;
                const singleSetHeight = scrollHeight / 3;
                scrollContainer.scrollTop = singleSetHeight;
                let isResetting = false;
                scrollContainer.addEventListener('scroll', function () {
                    if (isResetting) return;
                    const scrollTop = scrollContainer.scrollTop;
                    if (scrollTop >= singleSetHeight * 2 - 10) {
                        isResetting = true;
                        scrollContainer.scrollTop = scrollTop - singleSetHeight;
                        isResetting = false;
                    } else if (scrollTop <= 10) {
                        isResetting = true;
                        scrollContainer.scrollTop = scrollTop + singleSetHeight;
                        isResetting = false;
                    }
                });
            }

            tagItems.forEach(function (item) {
                item.addEventListener('click', function () {
                    const tag = this.getAttribute('data-tag');
                    activeTag = (activeTag === tag) ? null : tag;
                    updateTagHighlights();
                    currentPage = 1;
                    applyFilters();
                });
            });

            categoryItems.forEach(function (item) {
                item.addEventListener('click', function () {
                    const category = this.getAttribute('data-category');
                    activeCategory = (activeCategory === category) ? null : category;
                    updateCategoryHighlights();
                    currentPage = 1;
                    applyFilters();
                });
            });

            if (searchInput) {
                searchInput.addEventListener('input', function () { currentPage = 1; applyFilters(); });
            }
            if (searchForm) {
                searchForm.addEventListener('submit', function (event) { event.preventDefault(); });
                searchForm.addEventListener('reset', function () {
                    window.setTimeout(function () { currentPage = 1; applyFilters(); }, 0);
                });
            }
            if (previousPageButton) {
                previousPageButton.addEventListener('click', function () {
                    if (!previousPageButton.disabled && currentPage > 1) { currentPage--; applyFilters(); }
                });
            }
            if (nextPageButton) {
                nextPageButton.addEventListener('click', function () {
                    if (!nextPageButton.disabled) { currentPage++; applyFilters(); }
                });
            }

            const savedContext = readContext();
            if (savedContext) {
                if (searchInput) { searchInput.value = savedContext.query || ''; }
                activeTag = savedContext.activeTag || null;
                activeCategory = savedContext.activeCategory || null;
                currentPage = Number.isInteger(savedContext.currentPage) ? savedContext.currentPage : 1;
                updateTagHighlights();
                updateCategoryHighlights();
            }
            applyFilters();
        });
    </script>
</body>

</html>
