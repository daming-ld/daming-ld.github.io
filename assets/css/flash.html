<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筒灯效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 200vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            padding: 40px;
            color: #fff;
        }

        /* ===== 页面内容 ===== */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 12px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .card ul {
            list-style: none;
            padding: 0;
        }

        .card ul li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ddd;
        }

        .card ul li:last-child {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            margin-left: 10px;
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .theme-toggle__icon {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto;
            filter: brightness(0) invert(1);
        }

        .theme-toggle.downlight-active {
            animation: buttonGlow 2.5s ease-in-out infinite;
        }

        @keyframes buttonGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 220, 0.3); }
            50% { box-shadow: 0 0 50px rgba(255, 255, 220, 0.6); }
        }

        /* ========================================
           筒灯效果 - 独立DOM元素
           ======================================== */

        /* 遮罩层容器 */
        .downlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }

        /* 黑暗遮罩 - 最底层 */
        .downlight-overlay__mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1;
        }

        /* 锥形光束 - 使用 clip-path 创建三角形 */
        .downlight-overlay__beam {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60vw;
            height: 100%;
            z-index: 2;
            
            /* 锥形光束 - 使用 clip-path 裁剪 */
            clip-path: polygon(
                50% 0%,          /* 顶部居中（光源点） */
                0% 100%,         /* 左下 */
                100% 100%        /* 右下 */
            );
            
            /* 光束渐变 - 从上到下亮度递减，从中心到边缘透明度递减 */
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(255, 255, 255, 0.6) 20%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.05) 80%,
                transparent 100%
            );
            
            /* 混合模式让光束更自然 */
            mix-blend-mode: lighten;
            
            /* 边缘羽化 */
            filter: blur(0.5px);
        }

        /* 光束核心区域 - 更亮 */
        .downlight-overlay__beam-core {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30vw;
            height: 100%;
            z-index: 3;
            
            clip-path: polygon(
                50% 0%,
                0% 100%,
                100% 100%
            );
            
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 255, 255, 0.6) 0%,
                rgba(255, 255, 255, 0.2) 30%,
                transparent 70%
            );
            
            mix-blend-mode: lighten;
            filter: blur(1px);
        }

        /* 光束边缘羽化层 - 让边缘更柔和 */
        .downlight-overlay__beam-soft {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 100%;
            z-index: 2;
            
            clip-path: polygon(
                50% 0%,
                0% 100%,
                100% 100%
            );
            
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(255, 255, 255, 0.15) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 70%
            );
            
            mix-blend-mode: lighten;
            filter: blur(3px);
        }

        /* 光源发光点 - 在遮罩之上 */
        .downlight-overlay__source {
            position: fixed;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            pointer-events: none;
            width: 160px;
            height: 70px;
        }

        .downlight-overlay__source-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 220, 0.95) 0%,
                rgba(255, 255, 220, 0.5) 30%,
                rgba(255, 255, 220, 0.15) 60%,
                transparent 80%
            );
            border-radius: 0 0 50% 50%;
            animation: sourcePulse 2.5s ease-in-out infinite;
        }

        .downlight-overlay__source-ring {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            border: 2px solid rgba(255, 255, 220, 0.25);
            border-top: none;
            border-radius: 0 0 50% 50%;
            box-shadow: 0 0 40px rgba(255, 255, 220, 0.1);
            animation: ringPulse 3s ease-in-out infinite;
        }

        /* 光源顶部装饰线 */
        .downlight-overlay__source-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: rgba(255, 255, 220, 0.2);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 255, 220, 0.1);
        }

        @keyframes sourcePulse {
            0%, 100% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.12);
            }
        }

        @keyframes ringPulse {
            0%, 100% {
                opacity: 0.4;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1.1);
            }
        }

        /* 光束照射到地面的光晕 */
        .downlight-overlay__floor-glow {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 60vw;
            height: 200px;
            z-index: 2;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 220, 0.15) 0%,
                rgba(255, 255, 220, 0.05) 40%,
                transparent 70%
            );
            mix-blend-mode: lighten;
            filter: blur(10px);
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .downlight-overlay__beam {
                width: 80vw;
            }
            .downlight-overlay__beam-core {
                width: 40vw;
            }
            .downlight-overlay__beam-soft {
                width: 100vw;
            }
            .downlight-overlay__floor-glow {
                width: 80vw;
            }
            .downlight-overlay__source {
                width: 120px;
                height: 50px;
            }
            .downlight-overlay__source-glow {
                width: 70px;
                height: 35px;
            }
            .downlight-overlay__source-ring {
                width: 90px;
                height: 18px;
            }
            .theme-toggle {
                width: 52px;
                height: 52px;
                bottom: 20px;
                right: 20px;
            }
            .theme-toggle__icon {
                width: 26px;
                height: 26px;
            }
            h1 { font-size: 2rem; }
            .content { padding: 20px; }
        }

        @media (max-width: 480px) {
            .downlight-overlay__beam {
                width: 90vw;
            }
            .downlight-overlay__beam-core {
                width: 50vw;
            }
            .downlight-overlay__beam-soft {
                width: 110vw;
            }
            .downlight-overlay__floor-glow {
                width: 90vw;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 页面内容 ===== -->
    <div class="content">
        <h1>💡 筒灯效果</h1>
        <p>
            点击右下角的按钮，会从屏幕顶部中央投射出45°的锥形光束。
            光束照射到的区域保持正常显示，其他区域变暗。
        </p>

        <div class="card">
            <h2>✨ 特性</h2>
            <ul>
                <li>🔦 45度锥形光束 <span class="badge">从顶部居中</span></li>
                <li>🌓 光束内正常显示，光束外变暗</li>
                <li>🎯 边缘羽化平滑过渡</li>
                <li>🔄 自动跟随页面滚动</li>
                <li>💾 状态自动保存</li>
            </ul>
        </div>

        <div class="card">
            <h2>📝 测试内容</h2>
            <p style="color:#aaa; font-size:1rem;">
                滚动页面查看效果是否持续。光束应该始终从顶部居中投射，
                覆盖整个页面高度。
            </p>
            <p style="color:#888; font-size:0.9rem; margin-top:10px;">
                👆 向下滚动查看更多内容，验证光束是否覆盖到底部
            </p>
        </div>

        <div style="height: 60px;"></div>
        <div class="card">
            <h2>📄 更多内容</h2>
            <p style="color:#aaa; font-size:1rem;">
                筒灯效果应该覆盖整个页面，包括这里的内容。
                光束区域内的所有内容都应该正常显示。
            </p>
        </div>
    </div>

    <!-- ===== 主题切换按钮 ===== -->
    <button class="theme-toggle" 
            type="button" 
            aria-label="打开筒灯" 
            aria-pressed="false"
            data-icon-sun="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Ccircle cx='12' cy='12' r='5'/%3E%3Cpath d='M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
            data-icon-moon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
        <img class="theme-toggle__icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' stroke='white' stroke-width='2'/%3E%3C/svg%3E" alt="" aria-hidden="true">
    </button>

    <!-- ========================================
    筒灯效果 - JavaScript
    ======================================== -->
    <script>
        (function() {
            'use strict';

            var STORAGE_KEY = 'downlight-mode';
            var MODE_ON = 'on';
            var MODE_OFF = 'off';
            var overlay = null;

            // ===== 获取存储状态 =====
            function getStoredMode() {
                try {
                    return localStorage.getItem(STORAGE_KEY) === MODE_ON ? MODE_ON : MODE_OFF;
                } catch (e) {
                    return MODE_OFF;
                }
            }

            function setStoredMode(mode) {
                try {
                    localStorage.setItem(STORAGE_KEY, mode);
                } catch (e) {}
            }

            // ===== 更新按钮状态 =====
            function updateToggleState(mode) {
                var toggle = document.querySelector('.theme-toggle');
                var icon = toggle ? toggle.querySelector('.theme-toggle__icon') : null;

                if (toggle && icon) {
                    if (mode === MODE_ON) {
                        icon.src = toggle.dataset.iconSun;
                        toggle.setAttribute('aria-label', '关闭筒灯');
                        toggle.setAttribute('aria-pressed', 'true');
                        toggle.classList.add('downlight-active');
                    } else {
                        icon.src = toggle.dataset.iconMoon;
                        toggle.setAttribute('aria-label', '打开筒灯');
                        toggle.setAttribute('aria-pressed', 'false');
                        toggle.classList.remove('downlight-active');
                    }
                }
            }

            // ===== 创建筒灯DOM =====
            function createDownlight() {
                if (overlay) return;

                // 1. 主容器
                overlay = document.createElement('div');
                overlay.className = 'downlight-overlay';
                overlay.id = 'downlight-overlay';

                // 2. 黑暗遮罩
                var mask = document.createElement('div');
                mask.className = 'downlight-overlay__mask';
                overlay.appendChild(mask);

                // 3. 光束 - 外层羽化
                var beamSoft = document.createElement('div');
                beamSoft.className = 'downlight-overlay__beam-soft';
                overlay.appendChild(beamSoft);

                // 4. 光束 - 主光束
                var beam = document.createElement('div');
                beam.className = 'downlight-overlay__beam';
                overlay.appendChild(beam);

                // 5. 光束 - 核心（更亮）
                var beamCore = document.createElement('div');
                beamCore.className = 'downlight-overlay__beam-core';
                overlay.appendChild(beamCore);

                // 6. 地面光晕
                var floorGlow = document.createElement('div');
                floorGlow.className = 'downlight-overlay__floor-glow';
                overlay.appendChild(floorGlow);

                // 7. 光源 - 发光点（在遮罩之上）
                var source = document.createElement('div');
                source.className = 'downlight-overlay__source';

                var sourceGlow = document.createElement('div');
                sourceGlow.className = 'downlight-overlay__source-glow';
                source.appendChild(sourceGlow);

                var sourceRing = document.createElement('div');
                sourceRing.className = 'downlight-overlay__source-ring';
                source.appendChild(sourceRing);

                var sourceLine = document.createElement('div');
                sourceLine.className = 'downlight-overlay__source-line';
                source.appendChild(sourceLine);

                overlay.appendChild(source);

                // 添加到页面
                document.body.appendChild(overlay);

                // 更新按钮状态
                updateToggleState(MODE_ON);

                // 响应窗口变化
                window.addEventListener('resize', onResize);
                window.addEventListener('scroll', onScroll);

                // 初始更新
                updateBeamSize();

                // 启动动画循环
                requestAnimationFrame(updateLoop);
            }

            // ===== 移除筒灯 =====
            function removeDownlight() {
                if (overlay) {
                    overlay.remove();
                    overlay = null;
                }

                updateToggleState(MODE_OFF);

                window.removeEventListener('resize', onResize);
                window.removeEventListener('scroll', onScroll);

                // 停止动画循环
                if (window._downlightLoopId) {
                    cancelAnimationFrame(window._downlightLoopId);
                    window._downlightLoopId = null;
                }
            }

            // ===== 更新光束尺寸 =====
            function updateBeamSize() {
                if (!overlay) return;

                var viewportHeight = window.innerHeight;
                var viewportWidth = window.innerWidth;

                // 根据视口调整光束宽度
                var beamWidth;
                if (viewportWidth < 480) {
                    beamWidth = 90;
                } else if (viewportWidth < 768) {
                    beamWidth = 80;
                } else {
                    beamWidth = 60;
                }

                // 更新光束元素的宽度
                var beam = overlay.querySelector('.downlight-overlay__beam');
                var beamCore = overlay.querySelector('.downlight-overlay__beam-core');
                var beamSoft = overlay.querySelector('.downlight-overlay__beam-soft');
                var floorGlow = overlay.querySelector('.downlight-overlay__floor-glow');

                if (beam) beam.style.width = beamWidth + 'vw';
                if (beamCore) beamCore.style.width = (beamWidth * 0.5) + 'vw';
                if (beamSoft) beamSoft.style.width = (beamWidth * 1.3) + 'vw';
                if (floorGlow) floorGlow.style.width = beamWidth + 'vw';

                // 更新光束高度
                var height = Math.max(viewportHeight * 2, 1500);
                var els = overlay.querySelectorAll(
                    '.downlight-overlay__beam, ' +
                    '.downlight-overlay__beam-core, ' +
                    '.downlight-overlay__beam-soft'
                );
                els.forEach(function(el) {
                    el.style.height = height + 'px';
                });

                // 更新地面光晕位置
                if (floorGlow) {
                    floorGlow.style.bottom = '-50px';
                    floorGlow.style.height = Math.min(viewportHeight * 0.3, 300) + 'px';
                }
            }

            // ===== 动画循环 =====
            function updateLoop() {
                if (!overlay) {
                    window._downlightLoopId = null;
                    return;
                }

                // 可以在这里添加动态效果，比如光束轻微晃动
                // 目前只做静态更新

                window._downlightLoopId = requestAnimationFrame(updateLoop);
            }

            // ===== 窗口事件 =====
            function onResize() {
                updateBeamSize();
            }

            function onScroll() {
                // 滚动时不需要更新，因为光束是fixed定位
            }

            // ===== 切换模式 =====
            function toggleDownlight() {
                var currentMode = getStoredMode();
                var nextMode = currentMode === MODE_ON ? MODE_OFF : MODE_ON;

                if (nextMode === MODE_ON) {
                    createDownlight();
                } else {
                    removeDownlight();
                }

                setStoredMode(nextMode);
            }

            // ===== 初始化 =====
            function init() {
                // 绑定按钮事件
                var toggle = document.querySelector('.theme-toggle');
                if (toggle) {
                    toggle.addEventListener('click', toggleDownlight);
                }

                // 恢复状态
                var mode = getStoredMode();
                if (mode === MODE_ON) {
                    setTimeout(function() {
                        createDownlight();
                        // 延迟更新尺寸确保布局稳定
                        setTimeout(updateBeamSize, 100);
                    }, 200);
                } else {
                    updateToggleState(MODE_OFF);
                }
            }

            // 等待DOM加载
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init, { once: true });
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
