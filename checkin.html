<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>每日打卡 | BigPeter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var bg = localStorage.getItem('site-bg');
                if (bg) document.documentElement.setAttribute('data-bg', bg);
            } catch (e) { }
        })();
    </script>
    <link rel="preload" href="assets/css/style.css?v=2" as="style">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
</head>

<body class="star-canvas-page">
    <svg class="liquid-glass-defs" aria-hidden="true" width="0" height="0" focusable="false">
        <defs>
            <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="1" seed="7" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="0.8" result="soft-noise" />
                <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="distorted" />
                <feGaussianBlur in="distorted" stdDeviation="0.2" result="smoothed" />
                <feComposite in="smoothed" in2="SourceAlpha" operator="in" />
            </filter>
        </defs>
    </svg>
    <header class="site-header">
        <nav class="nav">
            <button class="top-btn" type="button" aria-label="回到顶部">
                <img class="top-btn__icon" src="assets/icon/top.svg" alt="" aria-hidden="true">
            </button>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="about.html">关于</a>
                <a href="projects.html">项目</a>
                <a href="posts.html">文章</a>
                <a href="checkin.html" class="active">打卡</a>
                <div class="nav-indicator"></div>
            </div>
            <span class="nav-reading-title"></span>
            <div class="bg-selector" hidden>
                <button class="bg-btn" data-bg="paper" aria-label="纸张纹理背景" style="--dot-color: #E2D8CA;"><span class="bg-btn__dot"></span></button>
                <button class="bg-btn" data-bg="gradient" aria-label="渐变光晕背景" style="--dot-color: #C4956A;"><span class="bg-btn__dot"></span></button>
                <button class="bg-btn" data-bg="clean" aria-label="极简纯白背景" style="--dot-color: #E8E4DD;"><span class="bg-btn__dot"></span></button>
            </div>
            <button class="theme-toggle" type="button" aria-label="打开手电筒" aria-pressed="false" data-icon-sun="assets/icon/sun.svg" data-icon-moon="assets/icon/moon.svg">
                <img class="theme-toggle__icon" src="assets/icon/moon.svg" alt="" aria-hidden="true">
            </button>
        </nav>
    </header>

    <main class="page-container">
        <div class="page-shell">
            <div class="glass-card page-main-card checkin-main-card">
                <div class="page-content">
                    <div class="checkin-user-bar" id="userBar" style="display: none;">
                        <div class="user-info-left">
                            <img id="userAvatar" class="user-avatar" src="" alt="头像">
                            <span id="userName" class="user-name"></span>
                        </div>
                        <button type="button" id="logoutBtn" class="logout-btn">退出</button>
                    </div>
                    <div class="checkin-container">
                        <div class="checkin-status">
                            <div id="todayStatus" class="status-pending"><p>正在检查今日打卡状态...</p></div>
                            <button id="checkinBtn" class="checkin-btn" disabled><span class="btn-text">打卡中...</span></button>
                            <a id="loginBtn" class="checkin-btn" href="#" style="display: none;">GitHub 登录</a>
                        </div>
                        <div class="checkin-stats">
                            <div class="stats-grid">
                                <div class="stat-card"><div class="stat-value" id="totalDays">0</div><div class="stat-label">总打卡天数</div></div>
                                <div class="stat-card"><div class="stat-value" id="currentStreak">0</div><div class="stat-label">连续打卡</div></div>
                                <div class="stat-card"><div class="stat-value" id="longestStreak">0</div><div class="stat-label">最长连续</div></div>
                                <div class="stat-card"><div class="stat-value" id="thisMonth">0</div><div class="stat-label">本月打卡</div></div>
                            </div>
                        </div>
                        <div class="checkin-history">
                            <div id="historyList" class="history-list"><p>正在加载打卡历史...</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/nav.js" defer></script>
    <script src="assets/js/prefetch.js" defer></script>
    <script src="assets/js/checkin.js?v=2" defer></script>
</body>

</html>
